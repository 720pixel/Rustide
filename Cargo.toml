[package]
name = "rustide"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Fast, portable torrent creation, inspection, and editing"
license = "MIT"
repository = "https://github.com/720pixel/Rustide"
keywords = ["torrent", "bittorrent", "hashing", "cli", "metainfo"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
md-5 = "0.11"
rayon = "1.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
walkdir = "2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1
