[package]
name = "rustide"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Fast, portable torrent creation, inspection, and editing"
license = "MIT"
repository = "https://github.com/720pixel/Rustide"
keywords = ["torrent", "bittorrent", "hashing", "cli", "metainfo"]
categories = ["command-line-utilities", "filesystem"]
default-run = "rustide"

[features]
default = ["gui"]
gui = ["dep:egui", "dep:x11rb", "dep:windows-sys", "dep:windows"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
libc = "0.2"
memmap2 = "0.9"
md-5 = "0.11"
rayon = "1.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
walkdir = "2"
tempfile = "3"
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false, features = ["image"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", default-features = false, optional = true, features = ["std", "Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1
